name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege for the automatic GITHUB_TOKEN. Nothing here writes to the
# repo, so read-only is enough - and this is a public repo, where the default
# permissions are worth narrowing deliberately.
permissions:
  contents: read

# Never let two deploys race. A superseded run is cancelled rather than
# finishing after the newer one and rolling production backwards.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Unit tests only. scripts/integration.mjs needs a running server and
      # talks to a live Greenhouse board, so it is not gated on here.
      - run: npm test

  deploy:
    needs: test
    # Three independent conditions, because this is the job that holds the
    # Cloudflare credential:
    #   - only after tests pass
    #   - only from main
    #   - never from a pull request
    # On a public repo GitHub already withholds secrets from fork PRs, but this
    # does not rely on that being true - the job simply does not run.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Attach a GitHub Environment so the token can be scoped to it, and so
    # required reviewers can be added later without touching this file.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Stamp the commit being shipped. This has to happen here rather than in
      # the npm deploy script, because wrangler-action invokes wrangler
      # directly and never runs it - which had production reporting the commit
      # of whichever machine last stamped the file by hand.
      - run: node scripts/stamp-version.mjs
      # Third-party actions run in the same job as the credential and can read
      # its environment. `@v3` is a mutable tag: hardening step is to pin this
      # to a full commit SHA and let Dependabot bump it.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
